[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mazegen"
module-root = "."

[project]
name = "mazegen"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "numpy>=2.5.3",
]

[tool.mypy]
exclude = [
    "mlx/",
]
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = "mlx"
follow_imports="skip"
follow_untyped_imports = true