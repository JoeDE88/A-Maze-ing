[project]
name = "amazeing"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "numpy>=2.5.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
exclude = [
    "mlx/",
]
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = "mlx"
follow_imports="skip"